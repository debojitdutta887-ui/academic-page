        /* ---------------- THEMES ---------------- */

        /* 1. Default / Dashboard Theme */
        .theme-dashboard {

        }

        /* 2. English Major: Dark Academia / Vintage Library */
        .theme-lit {
            background-color: #1a1614;
            color: #d4c5b0;
            font-family: 'Cormorant Garamond', serif;
            background-image: url('https://images.unsplash.com/photo-1507842217121-9e859bd99490?q=80&w=2070&auto=format&fit=crop');
            background-blend-mode: overlay;
            background-size: cover;
            background-attachment: fixed;
        }
        .theme-lit .accent-text { color: #ffbf00; }
        .theme-lit .card {
            background: rgba(20, 15, 10, 0.85);
            border: 1px solid #3e3221;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        .theme-lit h1, .theme-lit h2 { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }

        /* 3. Education: Vintage Paper / History */
        .theme-edu {
            background-color: #f0e6d2;
            color: #3d342b;
            font-family: 'Special Elite', monospace; /* Typewriter */
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
        }
        .theme-edu .card {
            background: #fffdf0;
            border: 2px solid #8b7355;
            box-shadow: 5px 5px 0px #8b7355;
            transform: rotate(-1deg);
        }
        .theme-edu table { border-color: #5c4d3c; }
        .theme-edu th { background-color: #d6c6a8; color: #2a221a; }

        /* 4. Bengali: Cultural / Earthy */
        .theme-ben {
            background-color: #fff5f2;
            color: #591c0b;
            font-family: 'Tiro Bangla', serif;
            background-image: radial-gradient(circle at 50% 50%, #ffdecb 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .theme-ben .card {
            background: #fff;
            border-left: 8px solid #c92a2a;
            border-right: 8px solid #c92a2a;
            box-shadow: 0 10px 15px -3px rgba(168, 68, 68, 0.2);
        }
        .theme-ben h1 { color: #c92a2a; text-decoration: underline; text-decoration-style: wavy; }

        /* 5. VAC: Sovereign / Official */
        .theme-vac {
            background: linear-gradient(135deg, #fffbf0 0%, #fff 100%);
            color: #0f172a;
            font-family: 'Playfair Display', serif;
        }
        .theme-vac .header-strip {
            background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);

        .theme-vac .card {
            background: white;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);

        .theme-modern {
            background-color: #e0f2fe;
            color: #0c4a6e;
            font-family: 'Inter', sans-serif;

        }

        .back-btn {
            transition: transform 0.2s;
        }
        .back-btn:hover {
            transform: translateX(-5px);

</head>

        function renderDashboard() {
            // Reset Theme
            body.className = "theme-dashboard min-h-screen flex flex-col transition-colors duration-700";
            homeBtn.classList.add('hidden');

            let subjectCardsHTML = '';
            
            // Generate cards for dashboard
            for (const key in syllabusData) {
                const sub = syllabusData[key];
                subjectCardsHTML += `

                                <span class="bg-gray-50 text-gray-700 px-3 py-1 rounded-full border border-gray-200">${studentData.college}</span>

                    <!-- Subject Grid -->
                    <section>

                        </div>
                    </section>
                </div>
            `;
        }

        function renderSubject(key) {
            const data = syllabusData[key];
            
            // Change Theme Class
            body.className = `${data.themeClass} min-h-screen flex flex-col transition-colors duration-700`;
            homeBtn.classList.remove('hidden');

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });

            appRoot.innerHTML = `
                <div class="fade-in w-full max-w-5xl mx-auto pb-10">
                    <button onclick="renderDashboard()" class="back-btn mb-6 flex items-center gap-2 text-sm font-bold opacity-70 hover:opacity-100">
                        <i class="ph ph-arrow-left text-lg"></i> Back to Dashboard
                    </button>

                    <div class="header-section mb-10 text-center md:text-left border-b border-opacity-30 border-current pb-6">
                        <span class="text-sm font-bold tracking-widest uppercase opacity-60 mb-2 block">${data.code} • Credits: ${data.credits}</span>
                        <h1 class="text-4xl md:text-6xl font-bold mb-2">${data.title}</h1>
                        <p class="text-xl md:text-2xl opacity-80 italic">${data.subtitle}</p>
                        <div class="mt-4 inline-block px-4 py-1 rounded border border-opacity-40 border-current text-sm font-bold opacity-80">

                    </div>

                    <div class="syllabus-content">

                    </div>
                </div>

        // --- INITIALIZE ---
        renderDashboard();

    </script>
